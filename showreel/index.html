      sa(R.values[i], 'y', f2(y)); sa(R.valueBg[i], 'y', f2(y - 30));

    sa(R.typeRect, 'width', n ? f2(ends[n - 1] + 22) : 0);
    const f = Math.round(tq * FPS);

window.__fontsReady = document.fonts.load('700 34px "Inter Showreel"').then(() => document.fonts.ready).then(() => {
  const ok = [...document.fonts].some(f => f.family.replace(/"/g, '') === 'Inter Showreel' && f.status === 'loaded');

<script>
/* =====================================================================

const SR = 48000;

}
function env(param, t0, peak, attack, decay, floor = 0.0001) {
  param.setValueAtTime(floor, t0);

}
function noiseHit(ctx, NOISE, out, t0, { type = 'highpass', freq = 1000, q = 0.7, peak = 0.3, attack = 0.002, decay = 0.2, pan = 0, offset = 0 }) {
  const src = ctx.createBufferSource(); src.buffer = NOISE;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); env(g.gain, t0, peak, attack, decay);
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  src.connect(f).connect(g).connect(p).connect(out);
  src.start(t0, offset % 1.5, attack + decay + 0.05);
}
function tone(ctx, out, t0, { type = 'sine', f0 = 440, f1 = null, glide = 0.1, peak = 0.2, attack = 0.003, decay = 0.3, pan = 0 }) {
  const o = ctx.createOscillator(); o.type = type;

  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + glide);
  const g = ctx.createGain(); env(g.gain, t0, peak, attack, decay);
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  o.connect(g).connect(p).connect(out);

  o.frequency.setValueAtTime(155, t0);
  o.frequency.exponentialRampToValueAtTime(50, t0 + 0.12);
  o.frequency.exponentialRampToValueAtTime(43, t0 + 0.38);

  a.gain.setValueAtTime(0.0001, t0);
  a.gain.exponentialRampToValueAtTime(g, t0 + 0.004);
  a.gain.exponentialRampToValueAtTime(g * 0.4, t0 + 0.11);

  noiseHit(ctx, NOISE, out, t0, { type: 'bandpass', freq: 4200, q: 0.9, peak: 0.22 * amp, attack: 0.002, decay: 0.12 * len, pan: -0.3, offset: t0 * 0.29 });

async function renderSoundtrack() {

  [9.5, 10.0, 10.5, 11.0].forEach((t0, i) => tone(ctx, bus, t0, { f0: 1760 + 220 * i, peak: 0.05, attack: 0.002, decay: 0.05, pan: 0.3 }));

  for (let k = 0; k < 13; k++) noiseHit(ctx, NOISE, bus, 12.5 + 0.035 * k, { type: 'bandpass', freq: 5200, q: 2, peak: 0.03, attack: 0.001, decay: 0.018, offset: 0.4 + k * 0.07 });
  {
    const src = ctx.createBufferSource(); src.buffer = NOISE; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.0;
    bp.frequency.setValueAtTime(600, 14.1); bp.frequency.exponentialRampToValueAtTime(3800, 14.995);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, 14.1); g.gain.exponentialRampToValueAtTime(0.16, 14.99); g.gain.linearRampToValueAtTime(0, 15.0);
    src.connect(bp).connect(g).connect(bus); src.start(14.1, 0.7); src.stop(15.0);

}
